    <script>
      /* Ensure window.fetch has both getter and setter so external runner/extension scripts can safely wrap it */
      (function() {
        try {
          var origFetch = (typeof window.fetch === 'function') ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() { return origFetch; },
            set: function(fn) { origFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return protoFetch; },
              set: function(fn) { protoFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }
      })();
    </script>
